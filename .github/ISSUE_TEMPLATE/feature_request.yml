name: Feature request
description: Suggest an idea for EduSaathi
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
      placeholder: "e.g. Dark mode for the planner, or a quiz section"
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it help you?
    validations:
      required: false
