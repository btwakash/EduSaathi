name: Build Flutter APK
on:
  workflow_dispatch:
  push:
    paths: ["flutter/**"]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform folder
        run: flutter create --org com.edusaathi --project-name edusaathi --platforms=android .
      - name: Patch manifest (internet + https links)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i '0,/<application/s##<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' $M
          sed -i 's#</manifest>#    <queries><intent><action android:name="android.intent.action.VIEW"/><data android:scheme="https"/></intent></queries>\n</manifest>#' $M
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: EduSaathi-apk
          path: flutter/build/app/outputs/flutter-apk/app-release.apk
