name: Build Flutter APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Unpack project from zip
        run: |
          mkdir -p /tmp/proj
          unzip -q EduSaathi-flutter-fixed.zip -d /tmp/proj
          F=$(find /tmp/proj -name pubspec.yaml | head -n 1)
          if [ -z "$F" ]; then echo "No pubspec.yaml found in the zip"; exit 1; fi
          echo "PROJ=$(dirname "$F")" >> "$GITHUB_ENV"
      - name: Build APK
        run: |
          cd "$PROJ"
          flutter create --org com.edusaathi --project-name edusaathi --platforms=android .
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' $M
          sed -i 's#</manifest>#    <queries><intent><action android:name="android.intent.action.VIEW"/><data android:scheme="https"/></intent></queries>\n</manifest>#' $M
          flutter pub get
          dart run flutter_launcher_icons
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: EduSaathi-apk
          path: ${{ env.PROJ }}/build/app/outputs/flutter-apk/app-release.apk
