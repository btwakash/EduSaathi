name: Build APK
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check setup
        env:
          K: ${{ secrets.GROQ_API_KEY || secrets.GROQ_KEY }}
        run: |
          if [ ! -f www/index.html ]; then echo "::error::www/index.html not found in repo"; exit 1; fi
          if ! grep -q "__AI_KEY__" www/index.html; then echo "::error::www/index.html is the OLD version (no __AI_KEY__ placeholder). Replace it with the new index.html"; exit 1; fi
          if [ -z "$K" ]; then echo "::error::Secret GROQ_API_KEY is missing or empty. Add it in Settings > Secrets and variables > Actions > Secrets (Repository secrets)"; exit 1; fi
          case "$K" in gsk_*) ;; *) echo "::error::GROQ_API_KEY value does not start with gsk_"; exit 1;; esac

      - name: Inject AI config
        env:
          K: ${{ secrets.GROQ_API_KEY || secrets.GROQ_KEY }}
          M: ${{ vars.AI_MODEL }}
          T: ${{ vars.AI_TPM }}
        run: sed -i "s|__AI_KEY__|$K|; s|__AI_MODEL__|$M|; s|__AI_TPM__|$T|; s|__AI_PROXY_URL__||" www/index.html

      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - run: npm install
      - run: npx cap add android

      - name: Set app icon from logo.png
        run: |
          if [ ! -f logo.png ]; then echo "::warning::logo.png not found in repo root, using default icon"; exit 0; fi
          IM=$(command -v magick || command -v convert)
          R=android/app/src/main/res
          for d in mdpi:48:108 hdpi:72:162 xhdpi:96:216 xxhdpi:144:324 xxxhdpi:192:432; do
            IFS=: read n s f <<< "$d"
            mkdir -p $R/mipmap-$n
            $IM logo.png -resize ${s}x${s} $R/mipmap-$n/ic_launcher.png
            $IM logo.png -resize ${s}x${s} $R/mipmap-$n/ic_launcher_round.png
            g=$((f*66/100))
            $IM logo.png -resize ${g}x${g} -background none -gravity center -extent ${f}x${f} $R/mipmap-$n/ic_launcher_foreground.png
          done

      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk EduSaathi.apk
      - uses: actions/upload-artifact@v4
        with:
          name: EduSaathi-apk
          path: EduSaathi.apk
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: EduSaathi.apk
