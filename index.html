<style>
:root{--p:#0d9488;--bg:#fff;--tx:#111827;--mu:#6b7280;--bd:#e5e7eb;--a:#f59e0b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0f14;--tx:#e5e7eb;--mu:#9ca3af;--bd:#1f2937}}
:root[data-theme="dark"]{--bg:#0b0f14;--tx:#e5e7eb;--mu:#9ca3af;--bd:#1f2937}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 'Segoe UI',Roboto,Arial,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--bd);padding:10px 16px;display:flex;align-items:center;gap:8px}
header h1{font-size:1.05rem;margin:0;flex:1;font-weight:600;color:var(--p)}
.pill{font-size:.72rem;color:var(--mu)}
main{max-width:680px;margin:0 auto;padding:12px 16px 80px}
h2{font-size:1.5rem;margin:8px 0 0;font-weight:600}
.card{padding:16px 0;border-bottom:1px solid var(--bd)}
.card h3{margin:0 0 8px;font-size:.78rem;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--mu)}
.why{display:none;font-size:.8rem;color:var(--mu);margin:0 0 10px}body.sw .why{display:block}.why b{color:var(--p)}
button,.btn{background:var(--p);color:#fff;border:0;border-radius:8px;padding:8px 14px;font:inherit;font-size:.92rem;font-weight:500;cursor:pointer;text-decoration:none;display:inline-block;min-height:38px}
button.s,.btn.s{background:transparent;color:var(--p);border:1px solid var(--bd)}button.s.on{background:var(--p);color:#fff;border-color:var(--p)}button.a{background:var(--a);color:#222}
.hd{background:transparent;color:var(--mu);border:1px solid var(--bd);min-height:30px;padding:2px 10px;font-size:.78rem}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;margin:3px 0}
input:focus,textarea:focus,select:focus{border-color:var(--p);outline:0}input[type=checkbox],input[type=radio]{width:auto}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:0 1 auto}.grow{flex:1 1 140px!important}
.big{font-size:3rem;font-weight:300;text-align:center;font-variant-numeric:tabular-nums;margin:4px 0}
.bar{height:6px;background:var(--bd);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--p);width:0;transition:width .3s}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
nav button{flex:1;background:none;color:var(--mu);border-radius:0;font-size:.72rem;padding:12px 0;min-height:0;border-top:2px solid transparent}
nav button span{display:none}nav button.on{color:var(--p);border-top-color:var(--p);font-weight:600}
section{display:none}section.on{display:block}
.li{display:flex;gap:10px;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--bd)}.li:last-child{border:0}
.chat{max-height:260px;overflow:auto;margin-bottom:6px}.m{padding:8px 12px;border-radius:10px;margin:4px 0;white-space:pre-wrap}
.u{background:var(--p);color:#fff;margin-left:20%}.b{border:1px solid var(--bd);margin-right:6%}
#toast{position:fixed;left:16px;right:16px;bottom:64px;background:var(--tx);color:var(--bg);padding:10px 14px;border-radius:10px;display:none;z-index:9;font-size:.92rem}
.mood button{background:transparent;font-size:1.5rem;padding:2px 10px;color:inherit;border:1px solid var(--bd)}
.lowdata .opt{display:none}
a{color:var(--p)}:focus-visible{outline:2px solid var(--p);outline-offset:2px}
.sm{font-size:.85rem;color:var(--mu)}
.chip{display:inline-block;padding:3px 10px;border-radius:99px;border:1px solid var(--bd);margin:3px 3px 3px 0;cursor:pointer;font-size:.83rem}
.act{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.act button{background:transparent;color:var(--p);border:1px solid var(--bd);padding:5px 12px;min-height:32px;font-size:.85rem}
#nfc{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:8px}
.fc{padding:14px;border:1px solid var(--bd);border-radius:10px;min-height:90px;cursor:pointer;display:flex;align-items:center;justify-content:center;text-align:center}.fc.f{background:var(--p);color:#fff}

:root{--pg:#f6f8f9;--cd:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--pg:#080c10;--cd:#111820}}
:root[data-theme="dark"]{--pg:#080c10;--cd:#111820}
body{background:var(--pg);font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased}
header,nav{background:color-mix(in srgb,var(--pg) 82%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
h2{font-size:1.7rem;font-weight:700;letter-spacing:-.02em}
section.on{animation:fin .28s ease}@keyframes fin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 1px 2px rgba(16,24,40,.04),0 12px 28px -14px rgba(16,24,40,.16)}
button,.btn{background:linear-gradient(180deg,#14b8a6,#0d9488);box-shadow:0 1px 2px rgba(13,148,136,.4),inset 0 1px 0 rgba(255,255,255,.2);border-radius:10px;transition:transform .12s,box-shadow .2s,opacity .2s}
button:active,.btn:active{transform:scale(.97)}button:hover{opacity:.92}
button.s,.btn.s,.hd,.act button,nav button,.mood button{background:transparent;box-shadow:none}button.s.on{background:var(--p)}
input,select,textarea{border-radius:10px;transition:border-color .2s,box-shadow .2s}input:focus,textarea:focus,select:focus{box-shadow:0 0 0 3px rgba(13,148,136,.18)}
input[type=checkbox],input[type=radio]{accent-color:var(--p);width:20px;height:20px}
.big{font-size:3.6rem;font-weight:200;letter-spacing:-.03em}
.li{padding:11px 0}.bar{height:8px}

button,.btn{background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,0)),var(--p);color:var(--on,#fff)}
button.s,.btn.s,.hd,.act button,nav button,.mood button{background:transparent;box-shadow:none;color:var(--p)}
.hd{color:var(--mu)}.mood button{color:inherit}button.s.on{background:var(--p);color:var(--on,#fff)}
.u,.fc.f{background:var(--p);color:var(--on,#fff)}
main{padding-bottom:120px}#toast{bottom:92px}
nav{padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:62px;font-size:.78rem;border-top:0;border-radius:14px;margin:0 2px;color:var(--mu);font-weight:500}
nav button svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--p);background:color-mix(in srgb,var(--p) 12%,transparent);font-weight:600;border:0}
#seg{display:none;gap:4px;background:var(--bd);padding:4px;border-radius:14px;margin:6px 0 4px}
#seg button{flex:1;background:transparent;color:var(--mu);box-shadow:none;min-height:42px}#seg button.on{background:var(--cd);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:600}
input[type=color]{width:44px;height:34px;padding:2px;border-radius:8px;vertical-align:middle;margin:0 6px 0 4px;cursor:pointer}
.sw{display:inline-flex;align-items:center;gap:6px}.dot{width:14px;height:14px;border-radius:50%;border:1px solid var(--bd)}

@property --p{syntax:'<color>';inherits:true;initial-value:#7c3aed}
@property --p2{syntax:'<color>';inherits:true;initial-value:#c026d3}
:root{--p:#7c3aed;--p2:#c026d3;transition:--p .6s ease,--p2 .6s ease}
body{background:radial-gradient(60% 38% at 0% 0%,color-mix(in srgb,var(--p) 24%,transparent),transparent),radial-gradient(55% 40% at 100% 18%,color-mix(in srgb,var(--p2) 20%,transparent),transparent),radial-gradient(60% 40% at 50% 100%,color-mix(in srgb,var(--p) 14%,transparent),transparent),var(--pg);background-attachment:fixed}
button,.btn{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;box-shadow:0 6px 16px -6px color-mix(in srgb,var(--p) 70%,transparent)}
button.s,.btn.s,.hd,.act button,nav button,.mood button,#seg button{background:transparent;box-shadow:none}
button.s,.btn.s,.act button{color:var(--p)}.hd{color:var(--mu)}.mood button{color:inherit}nav button{color:var(--mu)}#seg button{color:var(--mu)}
button.s.on,.u,.fc.f{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff}
#seg button.on{background:var(--cd);color:var(--tx)}nav button.on{color:var(--p);background:color-mix(in srgb,var(--p) 14%,transparent)}
.card h3{color:var(--p)}.card h3::before{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;background:linear-gradient(135deg,var(--p),var(--p2));margin-right:8px}
header h1{background:linear-gradient(90deg,var(--p),var(--p2));-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800}
.bar i{background:linear-gradient(90deg,var(--p),var(--p2))}
.big{background:linear-gradient(135deg,var(--p),var(--p2));-webkit-background-clip:text;background-clip:text;color:transparent}
body.rest .big{background:linear-gradient(135deg,#10b981,#06b6d4);-webkit-background-clip:text;background-clip:text}
#wp{position:fixed;inset:-24px;z-index:-1;display:none;background-size:cover;background-position:center;filter:blur(var(--bl,0px));box-shadow:inset 0 0 0 100vmax rgba(0,0,0,var(--dim,.25))}
body.wp #wp{display:block}body.wp .card{background:color-mix(in srgb,var(--cd) 80%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
body.wp header,body.wp nav{background:color-mix(in srgb,var(--cd) 80%,transparent)}body.wp h2,body.wp #sub{color:#fff;text-shadow:0 1px 10px rgba(0,0,0,.55)}
.wt{width:46px;height:46px;border-radius:14px;padding:0;border:2px solid var(--bd);box-shadow:none}
/* animations */
section.on>.card{animation:rise .55s cubic-bezier(.2,.8,.2,1) both}
section.on>.card:nth-child(2){animation-delay:.05s}section.on>.card:nth-child(3){animation-delay:.1s}section.on>.card:nth-child(4){animation-delay:.15s}section.on>.card:nth-child(n+5){animation-delay:.2s}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
.li{animation:fin .35s ease both}
button{transition:transform .15s cubic-bezier(.3,1.6,.5,1),box-shadow .2s,filter .2s}button:hover{filter:brightness(1.08)}button:active{transform:scale(.94)}
nav button.on svg{animation:pop .45s cubic-bezier(.3,1.8,.5,1)}@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
body.run .big{animation:pulse 2s ease-in-out infinite}body.rest .big{animation:breathe 4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.04)}}@keyframes breathe{50%{transform:scale(1.1);opacity:.75}}
#toast{animation:up .35s cubic-bezier(.2,.9,.3,1.2)}@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.cf{position:fixed;top:-14px;width:8px;height:13px;border-radius:2px;z-index:30;pointer-events:none;animation:fall 1.5s ease-in forwards}@keyframes fall{to{transform:translate(var(--x),105vh) rotate(560deg)}}
.bar i{transition:width .7s cubic-bezier(.2,.8,.2,1)}
@media (prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}

/* ===== calm themes ===== */
:root[data-theme="forest"]{--bg:#f3f7f2;--pg:#eaf1ea;--cd:#f8fbf7;--tx:#1f3a2e;--mu:#5f7a6b;--bd:#d3e1d4;color-scheme:light}
:root[data-theme="ocean"]{--bg:#f1f7fa;--pg:#e6f1f6;--cd:#f7fbfd;--tx:#1d3b4f;--mu:#5d7e92;--bd:#cde0ea;color-scheme:light}
:root[data-theme="lavender"]{--bg:#f6f3fb;--pg:#eeeaf7;--cd:#fbf9fe;--tx:#33295a;--mu:#7a7399;--bd:#ded8ef;color-scheme:light}
:root[data-theme="sand"]{--bg:#fbf6ee;--pg:#f5eee2;--cd:#fffaf2;--tx:#4a3b2a;--mu:#8a7a66;--bd:#e8dcc8;color-scheme:light}
:root[data-theme="rose"]{--bg:#fbf3f5;--pg:#f6eaee;--cd:#fffafb;--tx:#4d2f3b;--mu:#8f6b79;--bd:#ecd6de;color-scheme:light}
:root[data-theme="midnight"]{--bg:#0e1424;--pg:#0b101d;--cd:#151d33;--tx:#d9e2f2;--mu:#8d9bb8;--bd:#25304b;color-scheme:dark}
:root[data-theme="moss"]{--bg:#0d1613;--pg:#0a110f;--cd:#13211c;--tx:#dcebe3;--mu:#8fa89c;--bd:#233630;color-scheme:dark}
:root[data-theme="forest"] .card,:root[data-theme="ocean"] .card,:root[data-theme="lavender"] .card,:root[data-theme="sand"] .card,:root[data-theme="rose"] .card{box-shadow:0 1px 2px rgba(60,80,70,.05),0 14px 30px -16px rgba(60,80,70,.2)}
